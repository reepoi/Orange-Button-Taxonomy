    TemperatureItemType:
      type: object
      properties:
        Unit:
          type: string
          oneOf:
            - const: Cel
              title: Celsius
              description: A temperature scale based on 0° for the freezing point
                of water and 100° for the boiling point of water at 1 atm pressure.
            - const: K
              title: Kelvin
              description: The kelvin is a unit of measure for temperature based upon
                an absolute scale. It is one of the seven base units in the International
                System of Units (SI) and is assigned the unit symbol K. The Kelvin
                scale is an absolute, thermodynamic temperature scale using as its
                null point absolute zero, the temperature at which all thermal motion
                ceases in the classical description of thermodynamics. The kelvin
                is defined as the fraction  1⁄273.16 of the thermodynamic temperature
                of the triple point of water (exactly 0.01 °C or 32.018 °F). In other
                words, it is defined such that the triple point of water is exactly
                273.16 K.
            - const: F
              title: Fahrenheit
              description: 'Fahrenheit is a unit of measure for temperature defined
                by two fixed points: the temperature at which water freezes into ice
                is defined as 32 °F, and the boiling point of water is defined to
                be 212 °F, a 180 °F separation, as defined at sea level and standard
                atmospheric pressure.'
    PressureItemType:
      type: object
      properties:
        Unit:
          type: string
          oneOf:
            - const: Pa
              title: Pascal
              description: The pascal is the SI derived unit of pressure used to quantify
                internal pressure, stress, Young's modulus and ultimate tensile strength.
                It is defined as one newton per square meter.
            - const: Bar
              title: Bar
              description: The bar is a metric unit of pressure, but is not approved
                as part of the International System of Units (SI). It is defined as
                exactly equal to 100000 Pa, which is slightly less than the current
                average atmospheric pressure on Earth at sea level.
            - const: psi
              title: Pounds Per Square Inch
              description: The pound per square inch is a unit of pressure or of stress
                based on avoirdupois units. It is the pressure resulting from a force
                of one pound-force applied to an area of one square inch.
            - const: atm
              title: Standard Atmosphere
              description: The standard atmosphere is a unit of pressure defined as
                101325 Pa (1.01325 bar). It is sometimes used as a reference or standard
                pressure.
    ForceItemType:
      type: object
      properties:
        Unit:
          type: string
          oneOf:
            - const: N
              title: Newton
              description: The newton is the International System of Units (SI) derived
                unit of force. One newton is the force needed to accelerate one kilogram
                of mass at the rate of one metre per second squared in direction of
                the applied force.
    ElectricChargeItemType:
      type: object
      properties:
        Unit:
          type: string
          oneOf:
            - const: Ah
              title: Ampere Hours
              description: An ampere hour or amp hour is a unit of electric charge,
                equal to the charge transferred by a steady current of one ampere
                flowing for one hour.
            - const: C
              title: Coulomb
              description: The coulomb is the International System of Units (SI) unit
                of electric charge. It is the charge transported by a constant current
                of one ampere in one second.
    PlaneAngleItemType:
      type: object
      properties:
        Unit:
          type: string
          oneOf:
            - const: Degree
              title: Degree
              description: The degree is a measurement of a plane angle, defined so
                that a full rotation is 360 degrees. In Std the degree is reported
                in a decimal format.
            - const: rad
              title: Radian
              description: The radian is the standard unit of angular measure. The
                radian is an SI derived unit.
