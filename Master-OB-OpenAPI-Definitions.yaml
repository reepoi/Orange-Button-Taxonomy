openapi: 3.1.0
info:
  version: 1.1.7
  title: OB OpenAPI Taxonomy
  description: OB OpenAPI Definitions For Orange Button.
paths: {}
servers: []
components:
  schemas:
    EnergyModel:
      type: object
      description: Energy model contains energy predictions and information about
        the model assumptions and information sources.
      properties:
        EnergyModelName:
          - $ref: '#/components/schemas/EnergyModelName'
        Description:
          - $ref: '#/components/schemas/Description'
        EnergyModelInput:
          - $ref: '#/components/schemas/EnergyModelInput'
        EnergyModelOutput:
          - $ref: '#/components/schemas/EnergyModelOutput'
        ModelRunDate:
          - $ref: '#/components/schemas/ModelRunDate'
        Scope:
          - $ref: '#/components/schemas/Scope'
        EnergyModelID:
          - $ref: '#/components/schemas/EnergyModelID'
    Product:
      type: object
      description: An item or equipment that is packaged and sold as a unit.
      properties:
        ProdName:
          - $ref: '#/components/schemas/ProdName'
        ProdCode:
          - $ref: '#/components/schemas/ProdCode'
        ProdType:
          - $ref: '#/components/schemas/ProdType'
        ProdSpecifications:
          - $ref: '#/components/schemas/ProdSpecifications'
        ProdCertifications:
          - $ref: '#/components/schemas/ProdCertifications'
        Description:
          - $ref: '#/components/schemas/Description'
        FileFolderURL:
          - $ref: '#/components/schemas/FileFolderURL'
        Dimension:
          - $ref: '#/components/schemas/Dimension'
        Packages:
          - $ref: '#/components/schemas/Packages'
        Warranties:
          - $ref: '#/components/schemas/Warranties'
        AlternativeIdentifiers:
          - $ref: '#/components/schemas/AlternativeIdentifiers'
        ProdID:
          - $ref: '#/components/schemas/ProdID'
        SubstituteProducts:
          - $ref: '#/components/schemas/SubstituteProducts'
        ManufacturerUPC:
          - $ref: '#/components/schemas/ManufacturerUPC'
        ProdQualifications:
          - $ref: '#/components/schemas/ProdQualifications'
        CommunicationStacks:
          - $ref: '#/components/schemas/CommunicationStacks'
        SourceCountries:
          - $ref: '#/components/schemas/SourceCountries'
        CompatibleProducts:
          - $ref: '#/components/schemas/CompatibleProducts'
        ProdDeclarations:
          - $ref: '#/components/schemas/ProdDeclarations'
        SafetyDatasheetFileFolderURL:
          - $ref: '#/components/schemas/SafetyDatasheetFileFolderURL'
        ProdManualFileFolderURL:
          - $ref: '#/components/schemas/ProdManualFileFolderURL'
        ProdDatasheetFileFolderURL:
          - $ref: '#/components/schemas/ProdDatasheetFileFolderURL'
        Manufacturer:
          - $ref: '#/components/schemas/Manufacturer'
        HardwareBOMs:
          - $ref: '#/components/schemas/HardwareBOMs'
    Device:
      type: object
      description: A singular instance of a Product, usually with a serial number
        or other unique identifier.
      properties:
        SerialNum:
          - $ref: '#/components/schemas/SerialNum'
        Description:
          - $ref: '#/components/schemas/Description'
        ProdCode:
          - $ref: '#/components/schemas/ProdCode'
        ProdID:
          - $ref: '#/components/schemas/ProdID'
        MaintDateLast:
          - $ref: '#/components/schemas/MaintDateLast'
        InServiceDate:
          - $ref: '#/components/schemas/InServiceDate'
        Warranties:
          - $ref: '#/components/schemas/Warranties'
        DeviceType:
          - $ref: '#/components/schemas/DeviceType'
        Components:
          - $ref: '#/components/schemas/Components'
        DeviceName:
          - $ref: '#/components/schemas/DeviceName'
        DeviceUUID:
          - $ref: '#/components/schemas/DeviceUUID'
        IsMaintainable:
          - $ref: '#/components/schemas/IsMaintainable'
        Nodes:
          - $ref: '#/components/schemas/Nodes'
        LifeCycleEvents:
          - $ref: '#/components/schemas/LifeCycleEvents'
        ExternalEvents:
          - $ref: '#/components/schemas/ExternalEvents'
        OMEvents:
          - $ref: '#/components/schemas/OMEvents'
        Comments:
          - $ref: '#/components/schemas/Comments'
        AlternativeIdentifiers:
          - $ref: '#/components/schemas/AlternativeIdentifiers'
        HardwareBOMID:
          - $ref: '#/components/schemas/HardwareBOMID'
        ConditionChecklists:
          - $ref: '#/components/schemas/ConditionChecklists'
        FileFolderURL:
          - $ref: '#/components/schemas/FileFolderURL'
        SCATE_UID:
          - $ref: '#/components/schemas/SCATE_UID'
    WeatherInstrumentDevice:
      type: object
      properties:
        AccuracyClass:
          - $ref: '#/components/schemas/AccuracyClass'
        CalibrationInterval:
          - $ref: '#/components/schemas/CalibrationInterval'
        PurchDate:
          - $ref: '#/components/schemas/PurchDate'
        DeviceCost:
          - $ref: '#/components/schemas/DeviceCost'
        ManufactureDate:
          - $ref: '#/components/schemas/ManufactureDate'
        Orientation:
          - $ref: '#/components/schemas/Orientation'
        HeightAboveGround:
          - $ref: '#/components/schemas/HeightAboveGround'
        FileFolderURL:
          - $ref: '#/components/schemas/FileFolderURL'
    MeterProduct:
      type: object
      properties:
        RevenueGrade:
          - $ref: '#/components/schemas/RevenueGrade'
    MeterDevice:
      type: object
      properties:
        CurrentTransducerRatio:
          - $ref: '#/components/schemas/CurrentTransducerRatio'
    ReferenceCellMeasurement:
      type: object
      properties:
        TempRefCell:
          - $ref: '#/components/schemas/TempRefCell'
        CurrentShortCircuit:
          - $ref: '#/components/schemas/CurrentShortCircuit'
        VoltageOpenCircuit:
          - $ref: '#/components/schemas/VoltageOpenCircuit'
    SoilingInstrumentDevice:
      type: object
      properties:
        SoilingInstrumentType:
          - $ref: '#/components/schemas/SoilingInstrumentType'
        CalibrationDateLast:
          - $ref: '#/components/schemas/CalibrationDateLast'
        MaintDateLast:
          - $ref: '#/components/schemas/MaintDateLast'
        Orientation:
          - $ref: '#/components/schemas/Orientation'
    ASTME2848ReportingConditions:
      type: object
      properties:
        IrradPlaneOfArray:
          - $ref: '#/components/schemas/IrradPlaneOfArray'
        TempAmb:
          - $ref: '#/components/schemas/TempAmb'
        WindSpeed:
          - $ref: '#/components/schemas/WindSpeed'
        RefCellCalibrationConstantAtRptCond:
          - $ref: '#/components/schemas/RefCellCalibrationConstantAtRptCond'
    ASTME2848DataRecord:
      type: object
      properties:
        IrradPlaneOfArray:
          - $ref: '#/components/schemas/IrradPlaneOfArray'
        TempAmb:
          - $ref: '#/components/schemas/TempAmb'
        WindSpeed:
          - $ref: '#/components/schemas/WindSpeed'
        DataSelected:
          - $ref: '#/components/schemas/DataSelected'
        DataFilterVisual:
          - $ref: '#/components/schemas/DataFilterVisual'
        DataFilterOutliers:
          - $ref: '#/components/schemas/DataFilterOutliers'
        DataFilterMissing:
          - $ref: '#/components/schemas/DataFilterMissing'
        DataFilterCollectionSystem:
          - $ref: '#/components/schemas/DataFilterCollectionSystem'
        DataFilterOutsideRange:
          - $ref: '#/components/schemas/DataFilterOutsideRange'
        DataFilterStability:
          - $ref: '#/components/schemas/DataFilterStability'
        DataFilterInverterClipping:
          - $ref: '#/components/schemas/DataFilterInverterClipping'
        DataFilterShading:
          - $ref: '#/components/schemas/DataFilterShading'
        DataFilterInstrumentAlignment:
          - $ref: '#/components/schemas/DataFilterInstrumentAlignment'
    DataFilterCriteria:
      type: object
      properties:
        FilterIrradMax:
          - $ref: '#/components/schemas/FilterIrradMax'
        FilterIrradMin:
          - $ref: '#/components/schemas/FilterIrradMin'
        FilterTempAmbMax:
          - $ref: '#/components/schemas/FilterTempAmbMax'
        FilterTempAmbMin:
          - $ref: '#/components/schemas/FilterTempAmbMin'
        FilterWindSpeedMax:
          - $ref: '#/components/schemas/FilterWindSpeedMax'
        FilterWindSpeedMin:
          - $ref: '#/components/schemas/FilterWindSpeedMin'
        FilterPowerACMax:
          - $ref: '#/components/schemas/FilterPowerACMax'
        FilterPowerACMin:
          - $ref: '#/components/schemas/FilterPowerACMin'
        FilterIrradStabilityMax:
          - $ref: '#/components/schemas/FilterIrradStabilityMax'
        FilterIrradStabilityWindowLen:
          - $ref: '#/components/schemas/FilterIrradStabilityWindowLen'
    ASTME2848Model:
      type: object
      properties:
        ASTME28484ModelCoeffA1:
          - $ref: '#/components/schemas/ASTME28484ModelCoeffA1'
        ASTME28484ModelCoeffA2:
          - $ref: '#/components/schemas/ASTME28484ModelCoeffA2'
        ASTME28484ModelCoeffA3:
          - $ref: '#/components/schemas/ASTME28484ModelCoeffA3'
        ASTME28484ModelCoeffA4:
          - $ref: '#/components/schemas/ASTME28484ModelCoeffA4'
        ASTME2848PowerRtgAtRptCond:
          - $ref: '#/components/schemas/ASTME2848PowerRtgAtRptCond'
        ASTME2848PowerRtgUncertainty:
          - $ref: '#/components/schemas/ASTME2848PowerRtgUncertainty'
        ASTME2848ModelResidualMean:
          - $ref: '#/components/schemas/ASTME2848ModelResidualMean'
        ASTME2848ModelResidualStandardDeviation:
          - $ref: '#/components/schemas/ASTME2848ModelResidualStandardDeviation'
    Address:
      type: object
      description: Physical or Mailing address
      properties:
        City:
          - $ref: '#/components/schemas/City'
        StateProvince:
          - $ref: '#/components/schemas/StateProvince'
        ZipPostalCode:
          - $ref: '#/components/schemas/ZipPostalCode'
        Country:
          - $ref: '#/components/schemas/Country'
        County:
          - $ref: '#/components/schemas/County'
        AddressType:
          - $ref: '#/components/schemas/AddressType'
        AddressID:
          - $ref: '#/components/schemas/AddressID'
        Location:
          - $ref: '#/components/schemas/Location'
        AddrLine1:
          - $ref: '#/components/schemas/AddrLine1'
        AddrLine2:
          - $ref: '#/components/schemas/AddrLine2'
        AddrLine3:
          - $ref: '#/components/schemas/AddrLine3'
        Description:
          - $ref: '#/components/schemas/Description'
    Contact:
      type: object
      description: A person or contact information
      properties:
        Address:
          - $ref: '#/components/schemas/Address'
        ContactID:
          - $ref: '#/components/schemas/ContactID'
        Email:
          - $ref: '#/components/schemas/Email'
        MobilePhone:
          - $ref: '#/components/schemas/MobilePhone'
        WorkPhone:
          - $ref: '#/components/schemas/WorkPhone'
        HomePhone:
          - $ref: '#/components/schemas/HomePhone'
        FirstName:
          - $ref: '#/components/schemas/FirstName'
        MiddleName:
          - $ref: '#/components/schemas/MiddleName'
        LastName:
          - $ref: '#/components/schemas/LastName'
        ContactType:
          - $ref: '#/components/schemas/ContactType'
        Description:
          - $ref: '#/components/schemas/Description'
        PreferredContactMethod:
          - $ref: '#/components/schemas/PreferredContactMethod'
        Title:
          - $ref: '#/components/schemas/Title'
        URL:
          - $ref: '#/components/schemas/URL'
        Timezone:
          - $ref: '#/components/schemas/Timezone'
    EngineeringReviewRequirements:
      type: array
      items:
        $ref: '#/components/schemas/EngineeringReviewRequirement'
    EngineeringReviewRequirement:
      type: object
      description: A review by a single engineer or other professional of a design
        or drawing set
      properties:
        Description:
          - $ref: '#/components/schemas/Description'
        StampType:
          - $ref: '#/components/schemas/StampType'
        EngineeringReviewType:
          - $ref: '#/components/schemas/EngineeringReviewType'
        RequirementLevel:
          - $ref: '#/components/schemas/RequirementLevel'
        RequirementNotes:
          - $ref: '#/components/schemas/RequirementNotes'
    Site:
      type: object
      description: The site of a solar installation or potential solar installation
      properties:
        SiteID:
          - $ref: '#/components/schemas/SiteID'
        SiteName:
          - $ref: '#/components/schemas/SiteName'
        SiteParcelID:
          - $ref: '#/components/schemas/SiteParcelID'
        SiteMandatoryAccessReqrmnts:
          - $ref: '#/components/schemas/SiteMandatoryAccessReqrmnts'
        Addresses:
          - $ref: '#/components/schemas/Addresses'
        Description:
          - $ref: '#/components/schemas/Description'
        FileFolderURL:
          - $ref: '#/components/schemas/FileFolderURL'
        Contacts:
          - $ref: '#/components/schemas/Contacts'
        AuthorityHavingJurisdiction:
          - $ref: '#/components/schemas/AuthorityHavingJurisdiction'
        Structures:
          - $ref: '#/components/schemas/Structures'
        ElectricalServices:
          - $ref: '#/components/schemas/ElectricalServices'
        HomeownersAssociation:
          - $ref: '#/components/schemas/HomeownersAssociation'
        Fees:
          - $ref: '#/components/schemas/Fees'
        RiskDesignCriteria:
          - $ref: '#/components/schemas/RiskDesignCriteria'
        EnergyConsumptions:
          - $ref: '#/components/schemas/EnergyConsumptions'
        Comments:
          - $ref: '#/components/schemas/Comments'
        Jobs:
          - $ref: '#/components/schemas/Jobs'
        Contracts:
          - $ref: '#/components/schemas/Contracts'
        AlternativeIdentifiers:
          - $ref: '#/components/schemas/AlternativeIdentifiers'
        BatterySystems:
          - $ref: '#/components/schemas/BatterySystems'
        PVSystems:
          - $ref: '#/components/schemas/PVSystems'
        CustomElements:
          - $ref: '#/components/schemas/CustomElements'
    Addresses:
      type: array
      items:
        $ref: '#/components/schemas/Address'
    Contacts:
      type: array
      items:
        $ref: '#/components/schemas/Contact'
    City:
      description: Name of the city in the physical or mailing address.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    StateProvince:
      description: State of a Province of the mailing or physical address.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    ZipPostalCode:
      description: Zip Code / Postal Code of a mailing or physical address.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    Country:
      description: ISO country code where system is located.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    Latitude:
      description: Decimal value of latitude of the physical site in degrees.  Positive
        North of the Equator.  Negative South of the Equator
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/NumberItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/PlaneAngleItemType
    Longitude:
      description: Decimal value of longitude of the physical site in degrees.  Positive
        east of the Prime Meridian.  Negative west of the Prime Meridian.  North America
        is negative..
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/NumberItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/PlaneAngleItemType
    County:
      description: County of the physical or mailing address
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    Email:
      description: Email address
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    MobilePhone:
      description: Phone Number of a cell phone or mobile device.  This phone is expected
        to be able to receive text messages.  Characters like hyphen, period, x for
        extension are allowed.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    WorkPhone:
      description: Phone number to be used during working hours.  Characters like
        hyphen, period, x for extension are allowed.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    HomePhone:
      description: Phone number to be used for high priority calls only.  Characters
        like hyphen, period, x for extension are allowed.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    FirstName:
      description: First name of a person.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    MiddleName:
      description: Middle name of a person.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    LastName:
      description: The last name of person.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    Altitude:
      description: The height of ground level at a location relative to sea level.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/NumberItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/LengthItemType
    Location:
      type: object
      description: A location is defined by Latitude, Longitude and Altitude.
      properties:
        Latitude:
          - $ref: '#/components/schemas/Latitude'
        Longitude:
          - $ref: '#/components/schemas/Longitude'
        Altitude:
          - $ref: '#/components/schemas/Altitude'
        Elevation:
          - $ref: '#/components/schemas/Elevation'
        LocationType:
          - $ref: '#/components/schemas/LocationType'
        LocationID:
          - $ref: '#/components/schemas/LocationID'
        Description:
          - $ref: '#/components/schemas/Description'
        LocationDeterminationMethod:
          - $ref: '#/components/schemas/LocationDeterminationMethod'
    Elevation:
      description: Height above sea level.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/NumberItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/LengthItemType
    AddrLine1:
      description: First line of a mailing or physical address.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    AddrLine2:
      description: Second line of a mailing or physical address.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    AddrLine3:
      description: Third line of a mailing or physical address.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    EnergyModelName:
      description: Type of design/energy production model for the PV system which
        could be Pvsyst, SAM, PV Watts, or Other.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    EnergyModelConfigurationFilename:
      description: A filename holding the configuration details of the energy prediction
        details. This could be a zip file containing multiple files. The intention
        is to be able to reproduce the energy predictions if needed.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    Description:
      description: Generic Text field used in fields to provide more detail
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    BuildingCode:
      description: The applicable building code the AHJ enforces.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/BuildingCodeItemType
    BuildingCodeNotes:
      description: Notes for special requirements related to the building code in
        this AHJ.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    ResidentialCode:
      description: The applicable residential code the AHJ enforces.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/ResidentialCodeItemType
    FireCode:
      description: The applicable fire code the AHJ enforces.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/FireCodeItemType
    ElectricCode:
      description: The applicable electric code the AHJ enforces.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/ElectricCodeItemType
    ResidentialCodeNotes:
      description: Notes for special requirements related to the residential code
        in this AHJ.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    FireCodeNotes:
      description: Notes for special requirements related to the fire code in this
        AHJ.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    ElectricCodeNotes:
      description: Notes for special requirements related to the electric code in
        this AHJ.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    DocumentSubmissionMethod:
      description: The method for submitting AHJ documents.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/DocumentSubmissionMethodItemType
    DocumentSubmissionMethodNotes:
      description: Notes about the document submission process for this AHJ.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    EngineeringReviewType:
      description: The type of engineering or professional review
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/EngineeringReviewTypeItemType
    StampType:
      description: The type of certifying stamp that is applied to the design or drawing
        set
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StampTypeItemType
    AHJName:
      description: Name of the Authority Having Jurisdiction
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
    RequirementLevel:
      description: This field indicates if this instance of an object is required
        or optional. Conditionally optional the conditions can be described in RequirementNotes.
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/RequirementLevelItemType
    LocationDeterminationMethod:
      description: Method of the determining the location
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/LocationDeterminationMethodItemType
    ContactType:
      description: The type of contact being specified
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/ContactTypeItemType
    PreferredContactMethod:
      description: The method of contact the contact prefers
      allOf:
        - $ref: Master-OB-OpenAPI-ItemTypes.yaml#/components/schemas/StringItemType
