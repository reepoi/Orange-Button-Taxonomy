              title: Volt-ampere reactive
              description: In electric power transmission and distribution, volt-ampere
                reactive (var) is a unit by which reactive power is expressed in an
                AC electric power system. Reactive power is the power that is wasted
                and not used to do work on the load.
            - const: VA
              title: Volt-ampere
              description: A volt-ampere (VA) is the unit used for the apparent power
                in an electrical circuit, equal to the product of root-mean-square
                (RMS) voltage and RMS current. In direct current (DC) circuits, this
                product is equal to the real power (active power) in watts. Volt-amperes
                are useful only in the context of alternating current (AC) circuits.
            - const: MVA
              title: MVA
              description: Million Volt-Amperes
            - const: kVA
              title: kVA
              description: Thousand Volt-Amperes
