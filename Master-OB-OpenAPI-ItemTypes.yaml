    IdentifierTypeItemType:
      type: object
      properties:
        Value:
          type: string
          oneOf:
            - const: UUID
              title: UUID
              description: ''
            - const: UPC
              title: UPC
              description: ''
            - const: ProdCode
              title: ProdCode
              description: ''
            - const: Other
              title: Other
              description: ''
            - const: LEI
              title: Legal Entity Identifier
              description: A Legal Entity Identifier (LEI) is a 20-character alphanumeric
                code that uniquely identifies a legal entity that participates in
                financial transactions. The LEI is based on the ISO 17442 standard
                and is similar to a bar code for a store item.
            - const: PEN
              title: Private Enterprise Number
              description: Unique identifiers assigned by the Internet Assigned Numbers
                Authority (IANA) to organizations, allowing them to uniquely identify
                proprietary protocols, formats, or information relevant to their products
                and services. These numbers are typically used in network management
                protocols such as SNMP (Simple Network Management Protocol) to help
                differentiate between various vendors and their devices or applications.
            - const: DID
              title: Decentralized Identifier
              description: A type of digital identifier that enables individuals or
                entities to create and control their own identity without relying
                on a centralized authority. DIDs are designed to be self-sovereign,
                meaning they can be created, updated, and managed directly by their
                owners, independent of third-party intermediaries.  DIDs are typically
                implemented using distributed ledger technologies (blockchains) or
                other decentralized networks, which provide a secure and tamper-proof
                environment for storing and managing identity-related information.
                Each DID resolves to a DID document, which contains cryptographic
                keys, authentication methods, and other metadata necessary for verifying
                ownership and facilitating trusted interactions between parties. This
                approach promotes privacy, security, and user control over personal
                data in digital identity systems.
            - const: DUNS
              title: DUNS
              description: The Data Universal Numbering System (DUNS) is a proprietary
                system developed and maintained by Dun & Bradstreet (D&B) that assigns
                a unique numeric identifier, known as a DUNS number, to businesses
                and organizations worldwide. Each DUNS number is a nine-digit identifier
                that serves as a standard for identifying entities in financial, governmental,
                and commercial transactions.  The DUNS number helps establish a company's
                business credit profile, track its relationships with other entities,
                and support risk management and compliance. It is widely used by businesses,
                governments, and institutions to verify the credibility of organizations,
                assess potential partners or suppliers, and streamline global commerce.
            - const: DPP_EU
              title: EU Digital Product Passport
              description: The EU Digital Product Passport (DPP_EU) is a digital record
                containing essential information about a product's lifecycle, designed
                to enhance transparency, sustainability, and circular economy practices
                within the European Union. The DPP includes data on a product's materials,
                production processes, carbon footprint, recycling potential, and repair
                options, accessible by consumers, regulators, and businesses. By providing
                detailed, traceable insights, the DPP enables better decision-making
                regarding product sourcing, usage, and disposal, ultimately fostering
                responsible consumption and supporting the EU’s Green Deal goals.
            - const: FEIN
              title: Federal Employer Identification Number
              description: ''
            - const: UEI
              title: Unique Entity Identifier
              description: ''
